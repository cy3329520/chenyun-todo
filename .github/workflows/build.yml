name: 构建安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle-args: "--bundles dmg"
            artifact-path: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: windows-latest
            # 仅打 NSIS（exe 安装包）；WiX/msi 对中文产品名兼容性差
            bundle-args: "--bundles nsis"
            artifact-path: "src-tauri/target/release/bundle/nsis/*-setup.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: chenyun-todo/src-tauri

      - name: 安装前端依赖
        working-directory: chenyun-todo
        run: npm install

      - name: 构建应用
        working-directory: chenyun-todo
        run: npx tauri build ${{ matrix.bundle-args }}

      - name: 整理产物（重命名为英文，避免中文文件名丢失）
        shell: bash
        run: |
          mkdir -p chenyun-todo/dist
          cp chenyun-todo/${{ matrix.artifact-path }} chenyun-todo/dist/${{ matrix.artifact-name }}
          ls -la chenyun-todo/dist

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: 晨云待办-${{ matrix.os }}
          path: chenyun-todo/dist/*
          if-no-files-found: error

      - name: 发布到 Releases（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chenyun-todo/dist/*
          name: 晨云待办 ${{ github.ref_name }}
          body: |
            ## 晨云待办 ${{ github.ref_name }}

            - **Windows 10/11**：下载 `晨云待办_*_x64-setup.exe`，双击安装（中文界面）
            - **macOS (Apple Silicon)**：下载 `.dmg`，拖入 Applications

            > Windows SmartScreen 提示未知发布者时，选择「更多信息 → 仍要运行」；
            > macOS 如被拦截，到「系统设置 → 隐私与安全性」点「仍要打开」。
          draft: false
          prerelease: false
